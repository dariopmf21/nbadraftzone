<style>
:root{--pg:#0e1116;--bg:#0e1116;--card:#1a1f27;--tx:#f2f2f2;--mut:#a3acb9;--ac:#ff7a1a;--bd:#2c333d;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pg:#0e1116;--bg:#0e1116;--card:#1a1f27;--tx:#f2f2f2;--mut:#a3acb9;--ac:#ff7a1a;--bd:#2c333d;color-scheme:dark}}
:root[data-theme="dark"]{--pg:#0e1116;--bg:#0e1116;--card:#1a1f27;--tx:#f2f2f2;--mut:#a3acb9;--ac:#ff7a1a;--bd:#2c333d;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--pg);color:var(--tx);font:16px/1.5 system-ui,sans-serif}
body::before,body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-size:180px 180px;opacity:0;animation:ballfade 8s ease-in-out infinite}
body::before{background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22180%22 height=%22180%22 viewBox=%220 0 180 180%22%3E%3Cg transform=%22rotate%280 45 45%29%22 fill=%22none%22 stroke=%22%23ff7a1a%22 stroke-width=%222.2%22%3E%3Ccircle cx=%2245%22 cy=%2245%22 r=%2226%22/%3E%3Cpath d=%22M45 19V71M19 45H71%22/%3E%3Cpath d=%22M26.5 26.5Q42.4 45 26.5 63.5M63.5 26.5Q47.6 45 63.5 63.5%22/%3E%3C/g%3E%3Cg transform=%22rotate%2840 135 135%29%22 fill=%22none%22 stroke=%22%23ff7a1a%22 stroke-width=%222.2%22%3E%3Ccircle cx=%22135%22 cy=%22135%22 r=%2226%22/%3E%3Cpath d=%22M135 109V161M109 135H161%22/%3E%3Cpath d=%22M116.5 116.5Q132.4 135 116.5 153.5M153.5 116.5Q137.6 135 153.5 153.5%22/%3E%3C/g%3E%3C/svg%3E")}
body::after{background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22180%22 height=%22180%22 viewBox=%220 0 180 180%22%3E%3Cg transform=%22rotate%2870 135 45%29%22 fill=%22none%22 stroke=%22%23ff7a1a%22 stroke-width=%222.2%22%3E%3Ccircle cx=%22135%22 cy=%2245%22 r=%2226%22/%3E%3Cpath d=%22M135 19V71M109 45H161%22/%3E%3Cpath d=%22M116.5 26.5Q132.4 45 116.5 63.5M153.5 26.5Q137.6 45 153.5 63.5%22/%3E%3C/g%3E%3Cg transform=%22rotate%28110 45 135%29%22 fill=%22none%22 stroke=%22%23ff7a1a%22 stroke-width=%222.2%22%3E%3Ccircle cx=%2245%22 cy=%22135%22 r=%2226%22/%3E%3Cpath d=%22M45 109V161M19 135H71%22/%3E%3Cpath d=%22M26.5 116.5Q42.4 135 26.5 153.5M63.5 116.5Q47.6 135 63.5 153.5%22/%3E%3C/g%3E%3C/svg%3E");animation-delay:4s}

.lang{max-width:720px;margin:auto;padding:12px 16px 0;text-align:right}
.lang button{padding:4px 12px;font-size:14px}
header{padding:8px 16px 8px;max-width:720px;margin:auto}
h1{margin:0;font-size:28px;letter-spacing:-.5px}h1 span{color:var(--ac)}
.card,.panel{color:var(--tx)}
p.sub{color:var(--mut);margin:4px 0 0;font-size:19px;font-weight:600;line-height:1.3}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:14px;min-width:0;flex:1}.logo{width:56px;height:56px;border-radius:50%;flex:none}
.soc{display:grid;grid-template-columns:repeat(2,50px);grid-auto-rows:50px;gap:8px;flex:none}.soc a{display:flex;align-items:center;justify-content:center;border:1px solid var(--bd);background:var(--card,rgba(255,255,255,.04));border-radius:12px;color:var(--mut);text-decoration:none}.soc a:hover{color:var(--ac);border-color:var(--ac)}
nav{max-width:720px;margin:12px auto 0;padding:0 16px;display:flex;gap:8px;flex-wrap:wrap}
nav.main{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--bd);padding-bottom:12px}
nav.main::-webkit-scrollbar{display:none}
nav.main button{white-space:nowrap;text-transform:uppercase;font-size:13px;letter-spacing:.4px;font-weight:600}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:999px;cursor:pointer}
.split{display:inline-flex}.split button:first-child{border-radius:999px 0 0 999px;padding-right:10px}.split button:last-child{border-radius:0 999px 999px 0;padding-left:8px;padding-right:12px;border-left-color:rgba(14,17,22,.35)}
button.on{background:var(--ac);border-color:var(--ac);color:#0e1116;font-weight:700}
main{max-width:720px;margin:auto;padding:12px 16px 48px}
h2{font-size:22px;margin:12px 0 0}
input[type=search]{width:100%;font:inherit;padding:10px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);margin:10px 0 4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
.row{display:flex;gap:12px;align-items:center;cursor:pointer}
.rk{font-weight:700;font-size:20px;color:var(--ac);width:32px;text-align:center}
.ph{width:56px;height:56px;border-radius:50%;background:var(--bd);display:grid;place-items:center;font-weight:700;color:var(--mut);overflow:hidden;flex:none}
.ph img{width:100%;height:100%;object-fit:cover}
.nm{font-weight:600}.mt{color:var(--mut);font-size:14px}
.det{display:none;margin-top:12px;border-top:1px solid var(--bd);padding-top:10px;font-size:15px}
.card.open .det{display:block}
.det dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0}
.det dt{color:var(--mut)}.det dd{margin:0}
.det a{color:var(--ac);margin-right:12px}
.note{color:var(--mut);font-size:13px;margin-top:24px}
.blank{opacity:.55}
.flags{display:inline-flex;align-items:center;gap:5px;margin-left:8px;vertical-align:middle}
.fimg{height:13px;width:auto;border-radius:2px;box-shadow:0 0 0 1px rgba(128,128,128,.4)}
.flagE{font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;font-size:14px;font-weight:400}
.brow{display:flex;gap:12px;align-items:center}
.bctl{display:flex;gap:6px}.bctl button{padding:4px 10px}
button:disabled{opacity:.4;cursor:default}
.bbact{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
a.btn{display:inline-block;text-decoration:none;font:inherit;border-radius:999px;padding:8px 14px;background:var(--ac);color:#0e1116;font-weight:700}
.bbh{font-size:17px;margin:20px 0 4px}
.bar{display:flex;gap:8px;align-items:center}
.bar input[type=search]{flex:1;min-width:0;margin:10px 0 4px}
.bar button{white-space:nowrap;margin-top:6px}
.panel{gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:8px 0}
.panel label{display:grid;gap:4px;font-size:14px;color:var(--mut)}
.panel select,.panel input{font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);width:100%;margin:0}
input[type=text],input[type=search],input[type=number]{color:#111!important;-webkit-text-fill-color:#111;caret-color:#c2410c;background:#f4f1ec!important;border:1px solid #f4f1ec!important}
input::placeholder{color:#6b6b6b;opacity:1;-webkit-text-fill-color:#6b6b6b}
.two{display:flex;gap:8px}
.sugs{display:flex;flex-wrap:wrap;gap:6px}
.sg{padding:4px 10px;font-size:14px}
.info{flex:1;min-width:0}
.pos{margin-left:auto;text-align:right;font-size:14px;font-weight:600;color:var(--mut);max-width:42%;line-height:1.25}
.empty{border:1px dashed var(--bd);border-radius:14px;padding:20px;color:var(--mut);margin:14px 0}
.disc{max-width:720px;margin:28px auto 0;padding:16px 16px 28px;border-top:1px solid var(--bd);color:var(--mut);font-size:12px;line-height:1.5}

function ctryList(p){return (Array.isArray(p.country)?p.country:[p.country]).map(t).filter(c=>c&&c!=="—")}
function flagOf(p){
 if(p.blank)return "";
 const list=Array.isArray(p.country)?p.country:[p.country];
 const out=list.map(c=>{
  const name=t(c);if(!name||name==="—")return "";
  const code=(c&&c.cc)||ccmap()[norm(name)];if(!code||code.length!==2)return "";

 return out?' <span class="flags">'+out+'</span>':""}

 const link=(u,txt)=>u?`<a href="${esc(u)}" target="_blank" rel="noopener" style="white-space:nowrap">${txt}</a>`:"";
 const sub=mock?(p.mock.split("·")[1]||"").trim():teamTxt(p);
 return `<div class="card${p.blank?" blank":""}" onclick="this.classList.toggle('open')"><div class="row"><div class="rk">${mock?esc((p.mock||"").split(" ")[0]):rank}</div><div class="info"><div class="nm">${esc(nm)}${flagOf(p)}</div><div class="mt">${esc(sub)}${tag?" · "+esc(tag):""}</div></div><div class="pos">${esc(posText(p.pos))}</div></div>

let panelOpen=false,fpos="all",amin="",amax="",fcountry="",fsort="az",fregion="",fcls="";

function teamTxt(p){return p.team+(p.team2?" / "+p.team2:"")+(p.yr?" ("+p.yr+")":"")}
function ageNum(b){const yy=/^(\d{4})$/.exec(b||"");if(yy)return new Date().getFullYear()-(+yy[1]);const mm=/^(\d{4})-(\d{2})$/.exec(b||"");if(mm){const n=new Date();let a=n.getFullYear()-(+mm[1]);if(n.getMonth()<=(+mm[2])-1)a--;return a}const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(b||"");if(!m)return null;const n=new Date(),mo=(+m[2])-1;let a=n.getFullYear()-(+m[1]);if(n.getMonth()<mo||(n.getMonth()===mo&&n.getDate()<(+m[3])))a--;return a}
